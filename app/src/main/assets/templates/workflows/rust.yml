# cloudide:rust
name: Android and Rust Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '9.8.2'
      jdk:
        description: JDK version
        default: '21'
      artifact:
        description: Output files pattern
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '21' }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ github.event.inputs.gradle || '9.8.2' }}
      - uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - uses: actions/cache@v6
        id: ndkcache
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-v1
      - name: Rust toolchain for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          if [ ! -x "$HOME/.cargo/bin/cargo-ndk" ]; then cargo install cargo-ndk --locked; fi
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - name: Build
        env:
          TASK: ${{ github.event.inputs.task }}
        run: |
          [ -z "$TASK" ] && TASK=assembleDebug
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon $TASK; else gradle --no-daemon $TASK; fi
      - uses: actions/upload-artifact@v7
        with:
          name: output
          path: ${{ github.event.inputs.artifact || '**/build/outputs/apk/**/*.apk' }}
          if-no-files-found: warn

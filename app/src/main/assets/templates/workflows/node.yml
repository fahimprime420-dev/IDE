# cloudide:node
name: Node and React Native Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '8.13'
      jdk:
        description: JDK version
        default: '17'
      artifact:
        description: Output files pattern
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '17' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          npm ci || npm install
          if [ -d android ]; then
            cd android
            if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon assembleDebug; else echo "android/gradlew is missing"; exit 1; fi
          else
            npm run build --if-present
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: |
            ${{ github.event.inputs.artifact }}
            android/app/build/outputs/apk/**/*.apk
            dist/**
          if-no-files-found: warn

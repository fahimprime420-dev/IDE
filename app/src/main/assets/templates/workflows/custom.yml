# cloudide:custom
name: Custom Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '8.13'
      jdk:
        description: JDK version
        default: '17'
      artifact:
        description: Output files pattern
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '17' }}
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ hashFiles('settings.gradle', 'settings.gradle.kts', 'build.gradle', 'build.gradle.kts') != '' }}
        with:
          gradle-version: ${{ github.event.inputs.gradle || '8.13' }}
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Run build.sh
        run: |
          if [ ! -f build.sh ]; then echo "build.sh is missing in the project root"; exit 1; fi
          mkdir -p cloudide-out
          export OUT="$PWD/cloudide-out"
          export NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          export NDKBIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: ${{ github.event.inputs.artifact || 'cloudide-out/**' }}
          if-no-files-found: warn

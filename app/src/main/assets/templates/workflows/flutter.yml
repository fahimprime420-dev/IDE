# cloudide:flutter
name: Flutter Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '8.13'
      jdk:
        description: JDK version
        default: '17'
      artifact:
        description: Output files pattern
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '17' }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build
        run: |
          if [ ! -d android ]; then
            ORG=$(cat .flutter-org 2>/dev/null || echo com.example)
            cp lib/main.dart /tmp/main.dart
            flutter create --platforms=android --org "$ORG" .
            cp /tmp/main.dart lib/main.dart
          fi
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: ${{ github.event.inputs.artifact || 'build/app/outputs/flutter-apk/*.apk' }}
          if-no-files-found: warn

# cloudide:gradle
name: Android Build
on:
  workflow_dispatch:
    inputs:
      task:
        description: Gradle task
        default: assembleDebug
      gradle:
        description: Gradle version
        default: '8.13'
      jdk:
        description: JDK version
        default: '17'
      artifact:
        description: Output files pattern
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.jdk || '17' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ github.event.inputs.gradle || '8.13' }}
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build
        env:
          TASK: ${{ github.event.inputs.task }}
        run: |
          [ -z "$TASK" ] && TASK=assembleDebug
          if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew --no-daemon $TASK; else gradle --no-daemon $TASK; fi
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: ${{ github.event.inputs.artifact || '**/build/outputs/apk/**/*.apk' }}
          if-no-files-found: warn
